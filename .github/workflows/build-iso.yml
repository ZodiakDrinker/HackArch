name: Build HackArch Live ISO

on:
  push:
    branches: [ "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Firefox Extensions (FoxyProxy & Wappalyzer)
        run: |
          EXT_DIR="profile_archiso/airootfs/etc/skel/.mozilla/firefox/hackarch.default-release/extensions"
          mkdir -p "$EXT_DIR"

          # 1. Descargar FoxyProxy Standard
          curl -sL "https://addons.mozilla.org/firefox/downloads/latest/foxyproxy-standard/latest.xpi" \
            -o "$EXT_DIR/foxyproxy@patacango.com.xpi"

          # 2. Descargar Wappalyzer
          curl -sL "https://addons.mozilla.org/firefox/downloads/latest/wappalyzer/latest.xpi" \
            -o "$EXT_DIR/wappalyzer@gapplify.com.xpi"

      - name: Download & Inject Caido Desktop Binary
        run: |
          CAIDO_DIR="profile_archiso/airootfs/usr/local/bin"
          mkdir -p "$CAIDO_DIR"

          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/caido/caido/releases/latest | grep -o 'https://caido.download/releases/[^/"]*/caido-desktop-[^/"]*-linux-x86_64\.tar\.gz' | head -n 1)

          curl -sL "$DOWNLOAD_URL" | tar -xz -C "$CAIDO_DIR"

          chmod +x "$CAIDO_DIR"/caido* || true

      - name: Enable NetworkManager Service
        run: |
          WANTS_DIR="profile_archiso/airootfs/etc/systemd/system/multi-user.target.wants"
          mkdir -p "$WANTS_DIR"
          ln -sf /usr/lib/systemd/system/NetworkManager.service "$WANTS_DIR/NetworkManager.service"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Build Archiso in Arch Linux Container
        run: |
          mkdir -p out/
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            /bin/bash -c "
              pacman-key --init &&
              pacman-key --populate archlinux &&
              pacman -Syu --noconfirm archiso neovim git syslinux curl &&
              
              curl -O https://blackarch.org/stripe.sh &&
              chmod +x stripe.sh &&
              ./stripe.sh || true &&

              mkdir -p /workspace/profile_archiso/efiboot/loader/entries
              cp -rn /usr/share/archiso/configs/releng/syslinux /workspace/profile_archiso/ || true
              cp -rn /usr/share/archiso/configs/releng/efiboot /workspace/profile_archiso/ || true

              HOME=/workspace/profile_archiso/airootfs/etc/skel nvim --headless '+Lazy! sync' +qa || true &&

              mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/profile_archiso
            "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackArch-Live-ISO
          path: out/*.iso
          retention-days: 7
