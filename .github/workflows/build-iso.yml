name: Build HackArch Live ISO

on:
  push:
    branches: [ "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq file curl
      - name: Download & Inject Caido Desktop
        run: |
          set -e
          CAIDO_DIR="profile_archiso/airootfs/usr/local/bin"
          mkdir -p "$CAIDO_DIR"
          echo "======================================"
          echo " Descargando Caido Desktop"
          echo "======================================"
          CAIDO_URL=$(
            curl -fsSL https://caido.download/releases/latest |
            jq -r '
              .links[]
              | select(
                  .os == "linux"
                  and .arch == "x86_64"
                  and .kind == "desktop"
                  and .format == "AppImage"
                )
              | .link
            ' |
            head -n 1
          )
          if [ -z "$CAIDO_URL" ] || [ "$CAIDO_URL" = "null" ]; then
            echo "ERROR: No se encontró la AppImage de Caido"
            exit 1
          fi
          echo "URL:"
          echo "$CAIDO_URL"
          curl -fL \
            "$CAIDO_URL" \
            -o "$CAIDO_DIR/caido"
          chmod 755 "$CAIDO_DIR/caido"
          echo "Archivo descargado:"
          file "$CAIDO_DIR/caido"
          if ! file "$CAIDO_DIR/caido" | grep -qi "ELF\|AppImage"; then
            echo "ERROR: Caido descargado pero el archivo no parece ejecutable"
            exit 1
          fi
          ls -lh "$CAIDO_DIR/caido"
          echo "Caido correctamente integrado en la airootfs"
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h 
      - name: Build Archiso in Arch Linux Container
        run: |
          set -e
          mkdir -p out/
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            /bin/bash -c '
          set -euo pipefail
          echo "======================================"
          echo " 1. Inicializando pacman"
          echo "======================================"
          pacman-key --init
          pacman-key --populate archlinux
          echo "======================================"
          echo " 2. Instalando herramientas de build"
          echo "======================================"
          pacman -Syu --noconfirm \
            archiso \
            neovim \
            git \
            syslinux \
            curl
          echo "======================================"
          echo " 3. Sincronizando Neovim"
          echo "======================================"
          HOME=/workspace/profile_archiso/airootfs/etc/skel \
            nvim --headless "+Lazy! sync" +qa || true
          echo "======================================"
          echo " 4. Preparando bootloaders"
          echo "======================================"
          rm -rf /workspace/profile_archiso/syslinux
          rm -rf /workspace/profile_archiso/efiboot
          cp -r \
            /usr/share/archiso/configs/releng/syslinux \
            /workspace/profile_archiso/
          cp -r \
            /usr/share/archiso/configs/releng/efiboot \
            /workspace/profile_archiso/
          echo "Bootloaders copiados."
          echo "======================================"
          echo " 5. Activando copytoram"
          echo "======================================"
          echo "--- Syslinux ---"
          find /workspace/profile_archiso/syslinux \
            -type f \
            -name "*.cfg" \
            -print0 |
          while IFS= read -r -d "" file; do
            echo "Procesando: $file"
            sed -i -E \
              "/^[[:space:]]*APPEND[[:space:]]/ {
                /(^|[[:space:]])copytoram([[:space:]]|$)/! s/[[:space:]]*$/ copytoram/
              }" "$file"
          done
          echo "--- systemd-boot ---"
          if [ -d "/workspace/profile_archiso/efiboot/loader/entries" ]; then
            find /workspace/profile_archiso/efiboot/loader/entries \
              -type f \
              -name "*.conf" \
              -print0 |
            while IFS= read -r -d "" file; do
              echo "Procesando: $file"
              sed -i -E \
                "/^[[:space:]]*options[[:space:]]/ {
                  /(^|[[:space:]])copytoram([[:space:]]|$)/! s/[[:space:]]*$/ copytoram/
                }" "$file"
            done
          else
            echo "ADVERTENCIA: no existe loader/entries"
          fi
          echo "======================================"
          echo " 6. Verificando copytoram"
          echo "======================================"
          echo "--- Syslinux ---"
          grep -Rni -- "copytoram" \
            /workspace/profile_archiso/syslinux
          echo "--- systemd-boot ---"
          grep -Rni -- "copytoram" \
            /workspace/profile_archiso/efiboot || true
          echo "======================================"
          echo " 7. Comprobando profile"
          echo "======================================"
          ls -la /workspace/profile_archiso/
          echo "======================================"
          echo " 8. Construyendo ISO"
          echo "======================================"
          rm -rf /tmp/archiso-tmp
          mkdir -p /workspace/out
          mkarchiso \
            -v \
            -w /tmp/archiso-tmp \
            -o /workspace/out \
            /workspace/profile_archiso
          echo "======================================"
          echo " 9. Resultado"
          echo "======================================"
          echo "Contenido de /workspace/out:"
          ls -lah /workspace/out
          echo "======================================"
          echo " Buscando ISO"
          echo "======================================"
          find /workspace/out \
            -maxdepth 1 \
            -type f \
            -name "*.iso" \
            -ls
          if ! find /workspace/out \
            -maxdepth 1 \
            -type f \
            -name "*.iso" \
            | grep -q .; then
            echo "ERROR: mkarchiso terminó pero no se encontró ninguna ISO."
            exit 1
          fi
          echo "======================================"
          echo " BUILD COMPLETADO CORRECTAMENTE"
          echo "======================================"
          '
          echo "======================================"
          echo " ISO GENERADA EN EL RUNNER"
          echo "======================================"
          ls -lah out/
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackArch-Live-ISO
          path: out/*.iso
          retention-days: 7
