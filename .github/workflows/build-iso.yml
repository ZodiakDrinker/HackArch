name: Build HackArch Live ISO

on:
  push:
    branches: [ "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq file curl
      - name: Download & Inject Caido Desktop
        run: |
          set -e

          CAIDO_DIR="profile_archiso/airootfs/usr/local/bin"
          mkdir -p "$CAIDO_DIR"

          echo "======================================"
          echo " Descargando Caido Desktop"
          echo "======================================"

          CAIDO_URL=$(
            curl -fsSL https://caido.download/releases/latest |
            jq -r '
              .links[]
              | select(
                  .os == "linux"
                  and .arch == "x86_64"
                  and .kind == "desktop"
                  and .format == "AppImage"
                )
              | .link
            ' |
            head -n 1
          )

          if [ -z "$CAIDO_URL" ] || [ "$CAIDO_URL" = "null" ]; then
            echo "ERROR: No se encontró la AppImage de Caido"
            exit 1
          fi

          echo "URL:"
          echo "$CAIDO_URL"

          curl -fL \
            "$CAIDO_URL" \
            -o "$CAIDO_DIR/caido"

          chmod 755 "$CAIDO_DIR/caido"

          echo "Archivo descargado:"
          file "$CAIDO_DIR/caido"

          if ! file "$CAIDO_DIR/caido" | grep -qi "ELF\|AppImage"; then
            echo "ERROR: Caido descargado pero el archivo no parece ejecutable"
            exit 1
          fi

          ls -lh "$CAIDO_DIR/caido"

          echo "Caido correctamente integrado en la airootfs"
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h 
      - name: Build Archiso in Arch Linux Container
        run: |
          mkdir -p out/
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            /bin/bash -c "
              pacman-key --init &&
              pacman-key --populate archlinux &&
              pacman -Syu --noconfirm archiso neovim git syslinux curl &&
              cp -r /usr/share/archiso/configs/releng/syslinux /workspace/profile_archiso/
              cp -r /usr/share/archiso/configs/releng/efiboot /workspace/profile_archiso/
              HOME=/workspace/profile_archiso/airootfs/etc/skel nvim --headless '+Lazy! sync' +qa || true &&
              mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/profile_archiso
            "
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackArch-Live-ISO
          path: out/*.iso
          retention-days: 7
