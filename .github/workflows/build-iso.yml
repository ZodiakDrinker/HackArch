name: Build HackArch Live ISO

on:
  push:
    branches: [ "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download & Inject Caido Desktop
        run: |
          CAIDO_DIR="profile_archiso/airootfs/usr/local/bin"
          mkdir -p "$CAIDO_DIR"

          CAIDO_URL=$(curl -fsSL \
            https://api.github.com/repos/caido/caido/releases/latest |
            sed -n 's/.*"browser_download_url": "\([^"]*linux-x86_64[^"]*\.AppImage\)".*/\1/p' |
            head -n 1)

          if [ -z "$CAIDO_URL" ]; then
            echo "ERROR: No se encontró el AppImage de Caido"
            exit 1
          fi

          echo "Descargando Caido desde:"
          echo "$CAIDO_URL"

          curl -fL "$CAIDO_URL" \
            -o "$CAIDO_DIR/caido"

          chmod 755 "$CAIDO_DIR/caido"

          "$CAIDO_DIR/caido" --version || true

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Build Archiso in Arch Linux Container
        run: |
          mkdir -p out/
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            /bin/bash -c "
              pacman-key --init &&
              pacman-key --populate archlinux &&
              pacman -Syu --noconfirm archiso neovim git syslinux curl &&

              HOME=/workspace/profile_archiso/airootfs/etc/skel nvim --headless '+Lazy! sync' +qa || true &&

              cp -r /usr/share/archiso/configs/releng/syslinux /workspace/profile_archiso/
              cp -r /usr/share/archiso/configs/releng/efiboot /workspace/profile_archiso/

              mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/profile_archiso
            "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackArch-Live-ISO
          path: out/*.iso
          retention-days: 7
